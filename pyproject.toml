[project]
name = "langchain-llm-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kalyan_udd", email = "kalyansaiuddagiri22@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "dotenv>=0.9.9",
    "langchain>=1.4.9",
    "langchain-core>=1.7.6",
    "langchain-huggingface>=1.2.3",
    "pypdf>=7.1.0",
    "sentence-transformers>=6.3.0",
    "streamlit>=1.67.0",
    "torch>=2.15.0",
    "transformers>=5.22.2",
]

[project.scripts]
langchain-llm-app = "langchain_llm_app:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
